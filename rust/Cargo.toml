[package]
name = "han-compose-raster"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_raster"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
numpy = "0.27"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

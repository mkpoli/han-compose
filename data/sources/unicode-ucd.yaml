notes:
  - "`han_compose.variants` fetches both, checks them against these SHA-256s and reads a character's standardized variation sequences, the compatibility ideographs whose kCompatibilityVariant it is, and its kIRG_*Source values. Nothing of them is committed."
  - "The kIRG_*Source values are listed as data. No drawing `variants` makes is an IRG source glyph: its regional forms are Noto CJK's designs."
  - "`scripts/compose_ids.py bench --chars joyo` and `export-web --parity` read kJoyoKanji from the same Unihan archive."

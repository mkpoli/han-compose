notes:
  - "The README states the decomposition strategy: characters that are separate productive components are not decomposed (王 is not ⿱一土). The atlas reads that as its list of atomic characters: a character whose entry has no description operator and names itself, or a variant that is atomic in turn."
  - The sequences follow the IRG principles and partly come from glyphs made under GlyphWiki's hkcs namespace; the atlas uses only which characters the file leaves undecomposed, never its sequences.
  - Its forms are Hong Kong ones; a Japanese form mapped to a traditional variant that the file does decompose (説 to 說) is not atomic.

<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>艹 画廊 · 246 字</title>
<style>
:root { --line:#d8d8df; --muted:#62626c; color:#1b1b20; background:#fff; font:14px/1.5 system-ui,sans-serif }
* { box-sizing:border-box }
body, figure, ul { margin:0 }
header { padding:14px 16px; display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap }
h1, h2 { margin:0; font-size:20px }
h2 { padding:16px }
a { color:#315c8d; text-underline-offset:.2em }
.gallery { list-style:none; padding:1px; display:grid; gap:1px; background:var(--line); grid-template-columns:repeat(auto-fit,minmax(min(100%,10.75rem),1fr)) }
.gallery li { background:white; min-inline-size:0; padding:.45rem .5rem; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-content:start }
.name { grid-column:1/-1; display:flex; align-items:baseline; gap:.5rem; padding-inline:.25rem }
.name b { font-size:18px; font-weight:600 }
.name small { color:var(--muted); overflow-wrap:anywhere }
figure, td { text-align:center }
svg { display:block; margin:auto; inline-size:min(100%,84px); aspect-ratio:1 }
figcaption { font-size:11px; color:var(--muted) }
.matrix { overflow-x:auto }
table { margin-inline:auto; border-spacing:0; inline-size:100%; min-inline-size:31rem; max-inline-size:68rem; table-layout:fixed }
th, td { padding:3px; background:white }
thead th, tbody tr:last-child > *, th[rowspan] { border-block-end:1px solid var(--line) }
th[scope=row], thead th { font-size:13px; color:var(--muted); font-weight:500 }
th[scope=rowgroup] { font-size:22px; position:sticky; inset-inline-start:0 }
col.key { width:3rem }
@media(min-width:31rem) { .matrix { overflow:visible } thead th { position:sticky; inset-block-start:0; z-index:1 } }
@media(max-width:700px) { td svg { inline-size:min(100%,55px) } }
</style>
<header><h1>艹 画廊 · 正楷 246 字</h1><a href="#faces">五体对照</a></header>
<ul class="gallery" aria-label="正楷字形对照"><!-- cards --></ul>
<h2 id="faces">五体对照 · 连写艹与分写十十</h2>
<div class="matrix" role="region" aria-labelledby="faces" tabindex="0">
<table class="faces"><colgroup><col class="key"><col class="key"><col span="5"></colgroup>
<thead><tr><th scope="col">字</th><th scope="col">艹</th><th scope="col">正楷</th><th scope="col">黑体</th><th scope="col">宋体</th><th scope="col">仿宋</th><th scope="col">文楷</th></tr></thead>
<!-- comparisons --></table></div>
</html>

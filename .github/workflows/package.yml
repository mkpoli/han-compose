name: Package
# Each merge becomes the package the sites install, and the sites are told to take it.
on:
  push:
    branches: [main]
    paths: ['js/**', 'data/**', 'src/han_compose/wheat-face-cuts.json', 'scripts/publish_package.sh', 'bun.lock', 'package.json', 'LICENSE', '.github/workflows/package.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  # Publishing runs to the end; of the merges that wait, the newest is published.
  group: package
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: js
      - run: bun run check
        working-directory: js
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The whole history, so the script can tell an older commit from a newer one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - id: publish
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/publish_package.sh
    outputs:
      published: ${{ steps.publish.outputs.published }}
  # SITES_TOKEN starts each site's own `han-compose.yml`: a fine-grained token with Actions write on
  # the sites and nothing else. Without it a site takes the package on its own hourly run.
  notify:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        site: [unencoded-db, ids-input]
    env:
      GH_TOKEN: ${{ secrets.SITES_TOKEN }}
    steps:
      - if: env.GH_TOKEN != ''
        run: gh workflow run han-compose.yml --repo "mkpoli/${{ matrix.site }}" --ref main

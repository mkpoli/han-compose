name: Package
# Each merge becomes the package the sites install.
on:
  push:
    branches: [main]
    paths: ['js/**', 'data/**', 'src/han_compose/wheat-face-cuts.json', 'scripts/publish_package.sh', 'bun.lock', 'package.json', 'LICENSE', '.github/workflows/package.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  # Publishing runs to the end; of the merges that wait, the newest is published.
  group: package
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: js
      - run: bun run check
        working-directory: js
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The whole history, so the script can tell an older commit from a newer one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - id: publish
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/publish_package.sh

[project]
name = "han-compose"
version = "0.0.1"
description = "Draw an Ideographic Description Sequence as outlines in GenZui Sans (Noto Sans CJK JP)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fonttools>=4.55",
    "httpx>=0.28",
    "numpy>=2",
    "pyyaml>=6",
    "typer>=0.16",
]

[project.optional-dependencies]
# Training the layout, standalone and guide models (`scripts/compose_ids.py learn`, `learn-alone`)
# and the guide's forward pass. Drawing does not need it.
train = ["torch>=2.14"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

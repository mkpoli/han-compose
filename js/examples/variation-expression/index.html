<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>U+26201 · 幺形組合</title>
<link rel="stylesheet" href="gallery.css">
<main>
  <header><div class="heading"><span class="code">U+26201</span><h1>幺形組合</h1></div><button id="theme" type="button">切換明暗</button></header>
  <div class="layout">
    <section class="catalogue"><div class="section-head"><h2 id="matrix-title">兩處幺的組合</h2><span class="count">6 × 6</span></div>
      <div class="scroll" tabindex="0" role="region" aria-labelledby="matrix-title"><table id="matrix"><caption class="sr">列為糸中的幺，欄為率中的幺。每格並列兩個部件字形。</caption></table></div>
    </section>
    <aside>
      <section class="original"><div id="original"></div><div><h2>原字</h2><a id="font-source">文津宋體</a></div></section>
      <section class="selection"><div class="section-head"><h2>所選部件</h2><output id="position"></output></div>
        <div class="pair"><div><h3>糸中的幺</h3><div id="left"></div><p class="path" id="left-path"></p></div>
        <div><h3>率中的幺</h3><div id="right"></div><p class="path" id="right-path"></p></div></div>
        <div class="field-head"><label for="ids">組合IDS</label><button id="copy" type="button">複製</button></div>
        <textarea rows="3" id="ids" readonly spellcheck="false"></textarea><span role="status" class="sr" id="status"></span>
      </section>
      <details><summary>來源與授權</summary><ul id="sources"></ul></details>
    </aside>
  </div>
</main>
<script defer src="app.js"></script>
</html>
